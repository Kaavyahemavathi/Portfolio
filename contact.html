<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Contact Your Name for web development projects and collaborations.">

    <meta name="author" content="Your Name">
    <meta name="robots" content="index, follow">

    <title>Contact | Your Name</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <a href="#main-content" class="skip-link">
        Skip to main content
    </a>

    <header role="banner">

        <div class="container">

            <a href="index.html" class="logo">
                Your Name
            </a>

            <nav aria-label="Primary navigation">
                <ul>

                    <li>
                        <a href="index.html">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="about.html">
                            About
                        </a>
                    </li>

                    <li>
                        <a href="projects.html">
                            Projects
                        </a>
                    </li>

                    <li>
                        <a href="contact.html" aria-current="page">
                            Contact
                        </a>
                    </li>

                </ul>
            </nav>

        </div>

    </header>

    <main id="main-content">

        <section aria-labelledby="contact-title">

            <div class="container">

                <h1 id="contact-title">
                    Contact Me
                </h1>

                <p>
                    Fill out the form below to get in touch.
                </p>

                <form action="#" method="post">

                    <div>
                        <label for="name">
                            Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            autocomplete="name"
                            required
                            aria-required="true"
                        >
                    </div>

                    <div>
                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            required
                            aria-required="true"
                        >
                    </div>

                    <div>
                        <label for="subject">
                            Subject
                        </label>

                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            required
                            aria-required="true"
                        >
                    </div>

                    <div>
                        <label for="message">
                            Message
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            required
                            aria-required="true"
                        ></textarea>
                    </div>

                    <button type="submit">
                        Send Message
                    </button>

                </form>

            </div>

        </section>

    </main>

    <footer role="contentinfo">

        <div class="container">

            <p>
                &copy; 2026 Your Name. All rights reserved.
            </p>

        </div>

    </footer>

</body>
</html>
